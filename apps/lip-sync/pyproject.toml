[project]
name = "lip-sync"
version = "0.1.0"
description = "Audio-based lip sync service using Whisper and g2p-en"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "openai-whisper>=20240930",
    "g2p-en>=2.1.0",
    "pydub>=0.25.1",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7.0",
    "audioop-lts>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
